services:
  web:
    build: .
    container_name: steam_web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=rootpassword
      - DB_NAME=steam
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:10.4
    container_name: steam_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=steam
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - "./steam (4).sql:/docker-entrypoint-initdb.d/init.sql:ro"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: steam_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=rootpassword
    depends_on:
      - db

volumes:
  db_data:
